<title>30 ans Swagnes</title>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Layout: Agnès cut-out stickers scattered on a fixed wall, frosted invitation card centered on top */
  :root {
    --bg: #e9e3fa; --card: #ffffff; --fg: #1d1838; --muted: #5f5a7d;
    --accent: #e0345f; --accent-fg: #ffffff; --line: #d9d3ee;
    --card-a: 76%;
    --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
    --body: "DM Sans", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14112a; --card: #1d1940; --fg: #f3f0ff; --muted: #b3add4;
      --accent: #ff6d8f; --accent-fg: #1a0b14; --line: #3d3873; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14112a; --card: #1d1940; --fg: #f3f0ff; --muted: #b3add4;
    --accent: #ff6d8f; --accent-fg: #1a0b14; --line: #3d3873; color-scheme: dark;
  }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; min-height: 100vh; min-height: 100svh;
         padding-inline: 16px; padding-block: 24px; box-sizing: border-box; display: flex; }
  .wall { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .s { position: absolute; left: var(--x); top: var(--y); width: clamp(84px, var(--w), 270px); height: auto;
       transform: rotate(var(--r)); animation: pop .6s cubic-bezier(.2,.8,.2,1) var(--d) backwards; }
  .s1{--x:1%;--y:3%;--w:17vw;--r:-6deg;--d:70ms}
  .s2{--x:20%;--y:24%;--w:10vw;--r:5deg;--d:140ms}
  .s3{--x:2%;--y:50%;--w:15vw;--r:4deg;--d:210ms}
  .s4{--x:19%;--y:56%;--w:11vw;--r:-4deg;--d:280ms}
  .s5{--x:4%;--y:76%;--w:14vw;--r:-3deg;--d:350ms}
  .s6{--x:76%;--y:2%;--w:17vw;--r:5deg;--d:420ms}
  .s7{--x:90%;--y:24%;--w:8vw;--r:-5deg;--d:490ms}
  .s8{--x:74%;--y:34%;--w:12vw;--r:-3deg;--d:560ms}
  .s9{--x:88%;--y:50%;--w:9vw;--r:6deg;--d:630ms}
  .s10{--x:73%;--y:62%;--w:14vw;--r:-5deg;--d:700ms}
  @keyframes pop { from { opacity: 0; transform: translateY(14px) rotate(var(--r)) scale(.92); } }
  @media (prefers-reduced-motion: reduce) { .s { animation: none; } }
  @media (max-width: 700px) {
    .s1{--x:1%;--y:1%;--w:38vw;--r:-5deg}
    .s2{--x:-3%;--y:29%;--w:21vw;--r:4deg}
    .s3{--x:0%;--y:74%;--w:36vw;--r:-3deg}
    .s4{--x:-1%;--y:50%;--w:23vw;--r:3deg}
    .s5{--x:66%;--y:73%;--w:34vw;--r:4deg}
    .s6{--x:55%;--y:2%;--w:42vw;--r:5deg}
    .s7{--x:80%;--y:30%;--w:21vw;--r:-5deg}
    .s8{--x:38%;--y:5%;--w:22vw;--r:-4deg}
    .s9{--x:80%;--y:51%;--w:20vw;--r:5deg}
    .s10{--x:35%;--y:79%;--w:34vw;--r:3deg}
  }
  main { position: relative; z-index: 1; width: 100%; max-width: 440px; margin: auto; display: flex; flex-direction: column; gap: 14px; }
  .card { background: color-mix(in srgb, var(--card) var(--card-a), transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
          border: 1px solid var(--line); border-radius: 20px; padding: 26px 24px; display: flex; flex-direction: column; gap: 18px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .big { font-family: var(--display); font-weight: 800; font-size: clamp(6rem, 30vw, 8.5rem); line-height: .8; letter-spacing: -.05em; margin: 0; color: var(--accent); }
  h1 { font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1.05; margin: 0; text-wrap: balance; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; border-top: 1px solid var(--line); padding-top: 16px; font-size: 16px; }
  dt { color: var(--muted); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; align-self: center; }
  dd { margin: 0; font-weight: 500; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .btn { display: block; text-align: center; text-decoration: none; font-weight: 700; font-size: 17px; padding: 16px 18px; border-radius: 14px; border: 2px solid var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); }
  .btn.secondary { background: var(--card); color: var(--accent); }
  .btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .hint { margin: 0; align-self: center; color: var(--muted); background: color-mix(in srgb, var(--card) 85%, transparent); border-radius: 12px; padding: 8px 12px; font-size: 13px; line-height: 1.5; text-align: center; }
  .count { font-variant-numeric: tabular-nums; }
</style>
</head>
